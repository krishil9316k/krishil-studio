<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to WhatsApp</title>
<meta name="theme-color" content="#0B2A4A">
<style>
:root{--navy:#0B2A4A;--wa:#1FA855;--ink:#14212B;--muted:#5D6B78;--bg:#F5F7F6;--card:#fff;--line:#E3E8EA}
@media (prefers-color-scheme:dark){:root{--ink:#E8EEF1;--muted:#9FB0BC;--bg:#0C141B;--card:#15212B;--line:#24343F}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
header span{color:#FFC72C}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:700 17px system-ui;cursor:pointer;
  background:var(--wa);color:#fff;text-align:center;text-decoration:none;margin-top:12px}
.btn.ghost{background:transparent;color:var(--wa);border:2px solid var(--wa)}
.msg{white-space:pre-wrap;font-size:14px;line-height:1.45;max-height:45vh;overflow:auto;margin:0}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>KRISHIL <span>Studio</span> · WhatsApp</header>
<main>
  <p class="muted" id="state">Getting today's message…</p>
  <div class="card"><pre class="msg" id="msg"></pre></div>
  <a class="btn" id="go" href="#">📲 Open WhatsApp & choose group</a>
  <button class="btn ghost" id="copy">Copy text</button>
  <p class="muted">In WhatsApp: pick your group → tap Send. Then come back and mark it sent in the app (optional).</p>
</main>
<script>
const id=new URLSearchParams(location.search).get("id")||"";
const [, owner]=location.hostname.match(/^([^.]+)\.github\.io$/)||[];
const repo=location.pathname.split("/").filter(Boolean)[0]||"krishil-studio";
const $=s=>document.querySelector(s);
async function load(){
  if(!/^[\w\-]+$/.test(id)||!owner){$("#state").textContent="This link is not complete. Open the WhatsApp tab in the app instead.";return}
  const url=`https://raw.githubusercontent.com/${owner}/${repo}/main/queues/whatsapp/ready/${id}.json?t=${Date.now()}`;
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const item=await r.json(), text=item.message||"";
    $("#msg").textContent=text;
    const wa="https://wa.me/?text="+encodeURIComponent(text);
    $("#go").href=wa;
    $("#copy").onclick=()=>navigator.clipboard.writeText(text).then(()=>$("#state").textContent="Copied ✅").catch(()=>{});
    $("#state").textContent="Opening WhatsApp…";
    setTimeout(()=>{location.href=wa},600);   // straight into WhatsApp
    setTimeout(()=>{$("#state").textContent="If WhatsApp didn't open, tap the green button."},2500);
  }catch(e){$("#state").textContent="Message not found yet (it may still be uploading). Wait a minute and tap the alert again."}
}
load();
</script>
</body>
</html>
